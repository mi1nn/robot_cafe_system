recipe:

  id: cappuccino

  name: Cappuccino

  steps:

    - name: Find Cup          # 카메라로 컵을 찾아 집고, 바로 세워 cup_station(= cup_pick 자리)에 놓는다
      action: vision_pick

    - name: Cup Pick
      action: move
      pose: cup_pick

    - name: Grip Cup
      action: gripper
      command: close

    - name: Coffee Machine
      action: move
      pose: coffee_machine

    - name: Start Coffee
      action: io
      output: coffee_start
      value: true

    - name: Coffee Wait
      action: wait
      seconds: 5

    - name: Stop Coffee
      action: io
      output: coffee_start
      value: false

    - name: Milk Station
      action: move
      pose: milk_station

    - name: Milk Process
      action: io
      output: milk_start
      value: true

    - name: Milk Wait
      action: wait
      seconds: 5

    - name: Stop Milk
      action: io
      output: milk_start
      value: false

    - name: Serving
      action: move
      pose: serving

    - name: Release Cup
      action: gripper
      command: open
